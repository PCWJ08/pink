<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121014">
    <meta name="description" content="一个会主动开口的 AI 陪聊室，两个人格、同一屋檐、语音往返。">
    <title>专属陪伴</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="stylesheet" href="/theme.css?v=20261127">
</head>
<body>
    <div id="setup-page" class="page active">
        <div class="lang-switch lang-switch-setup" role="group" aria-label="Language">
            <button type="button" class="lang-option" data-lang-btn data-lang-value="zh">中文</button>
            <button type="button" class="lang-option" data-lang-btn data-lang-value="en">EN</button>
        </div>
        <div class="setup-card">
            <h1 data-i18n="setupTitle">欢迎</h1>
            <p data-i18n="setupSubtitle">为了给你更好的陪伴，请告诉我...</p>
            <input type="text" id="nickname-input" placeholder="你的专属昵称" maxlength="8" autocomplete="off" data-i18n-placeholder="nicknamePlaceholder">
            <div class="gender-select">
                <button type="button" class="gender-btn active" data-gender="male" data-i18n="male">我是男生</button>
                <button type="button" class="gender-btn" data-gender="female" data-i18n="female">我是女生</button>
            </div>
            <button type="button" id="enter-btn" disabled data-i18n="enter">开启心动房间</button>
            <button type="button" id="install-btn" class="install-btn" hidden data-i18n="install">安装到桌面</button>
        </div>
    </div>

    <div id="chat-page" class="page">
        <div class="topbar">
            <div class="topbar-title"><span id="display-name">未命名</span><span id="room-suffix" data-i18n="roomSuffix"> 的房间</span></div>
            <div class="lang-switch lang-switch-chat" role="group" aria-label="Language">
                <button type="button" class="lang-option" data-lang-btn data-lang-value="zh">中文</button>
                <button type="button" class="lang-option" data-lang-btn data-lang-value="en">EN</button>
            </div>
        </div>

        <div class="system-banner" data-i18n="banner">与你的专属陪伴体聊天吧</div>

        <div id="messages"></div>

        <div class="input-area">
            <button type="button" id="voice-btn" class="voice-btn" aria-label="按住说话" data-i18n="voiceHold">按住说话</button>
            <div class="input-wrapper">
                <input type="text" id="chat-input" class="chat-input" placeholder="发消息..." maxlength="60" autocomplete="off" data-i18n-placeholder="chatPlaceholder">
                <button type="button" id="send-btn" class="send-btn" data-i18n="send">发送</button>
            </div>
        </div>

        <div class="footer-sign" data-i18n="footer">未登录 · 亲署</div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js?v=20261127" defer></script>
</body>
</html>
